<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI Usage Widget</title>
<style>
:root{--ink:#1B1B1A;--ink2:rgba(0,0,0,.6);--ink3:rgba(0,0,0,.4);--track:rgba(0,0,0,.1);--line:rgba(0,0,0,.08);
  --bar:rgba(0,0,0,.45);--ok:#23925F;--warn:#B97A06;--bad:#CC4433;--hover:rgba(0,0,0,.06);--panel:rgba(255,255,255,.30);--edge:transparent;--shadow:none}
body.s-smoke{--ink:#F6F6F4;--ink2:rgba(255,255,255,.70);--ink3:rgba(255,255,255,.46);--track:rgba(255,255,255,.16);--line:rgba(255,255,255,.10);
  --bar:rgba(255,255,255,.6);--ok:#55DBA0;--warn:#FFC24D;--bad:#FF8070;--hover:rgba(255,255,255,.10);--panel:rgba(16,16,18,.64);--edge:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(0,0,0,.45);--ckmark:#111}
body.s-frost{--ink:#161615;--ink2:rgba(0,0,0,.66);--ink3:rgba(0,0,0,.52);--track:rgba(0,0,0,.12);--line:rgba(0,0,0,.08);
  --bar:rgba(0,0,0,.5);--ok:#1E8F5B;--warn:#B07205;--bad:#C93E2E;--hover:rgba(0,0,0,.06);--panel:rgba(250,250,247,.72);--edge:rgba(255,255,255,.7);
  --shadow:0 0 6px rgba(255,255,255,.5);--ckmark:#fff}
body.s-clear{--ink:#FFFFFF;--ink2:rgba(255,255,255,.86);--ink3:rgba(255,255,255,.72);--track:rgba(255,255,255,.28);--line:rgba(255,255,255,.18);
  --bar:rgba(255,255,255,.9);--ok:#5FF0B0;--warn:#FFC94D;--bad:#FF7F6E;--hover:rgba(255,255,255,.14);--panel:transparent;--edge:transparent;
  --shadow:0 1px 2px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.55);--ckmark:#111}
body.s-clear.open{--panel:rgba(8,8,10,.30)}
body.s-clear.setting{--panel:rgba(8,8,10,.62)}
body.s-clear .tr,body.s-clear .dot{box-shadow:0 0 3px rgba(0,0,0,.7)}
body.s-clear svg.sp{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.8))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:var(--ink);overflow:hidden;user-select:none;
  font:12px/1.4 "Segoe UI Variable Text","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;text-shadow:var(--shadow)}
#app{display:inline-flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:17px}
body.up #app{flex-direction:column-reverse}
body.open #app{border-radius:16px;width:300px}
body.open .pi em{display:none}
.pill{height:32px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;gap:11px;white-space:nowrap}
.pi{display:flex;align-items:center;gap:4px;color:var(--ink2);font-size:11px}
.pi b{font-weight:600;color:var(--ink);font-size:13px}
.pi em{font-style:normal;color:var(--ink3);margin-left:3px}
.hide{display:none!important}
.tgw{display:flex;align-items:center;padding:8px 6px;margin:-8px -8px -8px -4px;cursor:pointer}
.tg{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink3);transition:background .15s,border-color .15s,transform .15s}
.tg.on{background:var(--ink2);border-color:var(--ink2)}
.tgw:hover .tg{border-color:var(--ink);transform:scale(1.15)}
.tgw:hover .tg.on{background:var(--ink)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.dot.live{background:var(--ok);animation:pulse 1.2s ease-in-out infinite}
.dot.busy{background:var(--warn);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.card{display:none;padding:0 18px 6px}
body.open .card{display:block}
body.open .pill{border-bottom:1px solid var(--line);padding:0 18px}
body.open.up .pill{border-bottom:0;border-top:1px solid var(--line)}
.sec{padding:13px 0 1px}
.top{display:flex;justify-content:space-between;align-items:baseline}
.nm{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.big{font-size:21px;font-weight:600;letter-spacing:-.3px}
.big small{font-size:12px;font-weight:400;color:var(--ink2);margin-left:1px}
.tr{height:3px;background:var(--track);border-radius:2px;margin:7px 0 6px;position:relative}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--bar);transition:width .6s ease}
.tr i.warn{background:var(--warn)}.tr i.bad{background:var(--bad)}
.tr s{position:absolute;top:-3px;width:1.5px;height:9px;background:var(--ink3);border-radius:1px}
.mt{font-size:11px;color:var(--ink3);display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:8px;row-gap:1px;white-space:nowrap}
.mt span:last-child{margin-left:auto}
.nm em{font-style:normal;color:var(--ink3);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oas{margin-top:3px}
.oa{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink2);padding:3px 0 1px;white-space:nowrap}
.oa .ol{overflow:hidden;text-overflow:ellipsis;max-width:96px}
.oa b{font-weight:600;color:var(--ink)}
.oa .om{margin-left:auto;color:var(--ink3);overflow:hidden;text-overflow:ellipsis}
.sg{display:grid;grid-template-columns:6px minmax(0,1fr) 34px 34px 42px;column-gap:6px;align-items:center;font-size:11px;color:var(--ink2);padding:3px 0 1px}
.sg.hd{color:var(--ink3);padding:1px 0 0}
.sg .sl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg .sn{text-align:right;font-weight:600;color:var(--ink)}
.sg.hd .sn{font-weight:400;color:var(--ink3)}
.sg .sn.warn{color:var(--warn)}.sg .sn.bad{color:var(--bad)}
.sg .sa{text-align:right;color:var(--ink3)}
.sg .sa button{color:var(--ink);background:var(--hover);padding:1px 6px}
.swb{margin-top:5px;padding-top:4px;border-top:1px solid var(--line)}
.swm{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;color:var(--ink2);min-height:20px;margin-top:2px}
.swm span{white-space:normal}
.swm.err span{color:var(--bad)}
.swm div{display:flex;gap:2px;flex:none}
.swm button{color:var(--ink);background:var(--hover);padding:2px 8px}
.ctl{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px;font-size:11px;color:var(--ink2);min-height:20px}
.ctl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctl.err span{color:var(--bad)}
.ctl button{color:var(--ink);background:var(--hover);padding:2px 12px;flex:none}
.ctl button:disabled{opacity:.45;cursor:default}
svg.sp{display:block;width:100%;height:26px;margin:7px 0 4px;overflow:visible}
.alert{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:11px;color:var(--warn)}
.alert.bad{color:var(--bad)}
.empty{padding:16px 0 6px;color:var(--ink2);font-size:12px}
.tools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;opacity:.55;transition:opacity .2s}
body.open:hover .tools{opacity:1}
body.setting .tools{display:none}
.seg{display:flex;gap:2px}
button{border:0;background:none;color:var(--ink3);font:11px inherit;padding:2px 7px;border-radius:6px;cursor:pointer;white-space:nowrap;text-shadow:var(--shadow)}
button:hover{background:var(--hover);color:var(--ink)}
button.on{color:var(--ink);background:var(--hover)}
a{color:var(--ink2);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.set h4{font-size:11px;font-weight:500;color:var(--ink3);margin:13px 0 4px;letter-spacing:.2px}
.row{display:flex;align-items:flex-start;gap:9px;padding:5px 0;cursor:pointer}
.row.sub{padding-left:23px}
.ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--ink3);flex:none;margin-top:1px;position:relative;transition:background .15s,border-color .15s}
.row.on .ck{background:var(--ink);border-color:var(--ink)}
.row.on .ck::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:7px;border:solid var(--ckmark);border-width:0 1.6px 1.6px 0;transform:rotate(45deg)}
.rt{flex:1;min-width:0}
.rt b{font-weight:500;font-size:12px;color:var(--ink)}
.rt p{font-size:11px;color:var(--ink3);margin-top:1px;white-space:normal}
.rt p.okt{color:var(--ink2)}
.badge{font-size:10px;padding:0 5px;border-radius:5px;background:var(--hover);color:var(--ok);margin-left:5px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px;color:var(--ink2);gap:8px}
.sw{width:26px;height:15px;border-radius:8px;background:var(--track);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--ink2);transition:left .15s,background .15s}
.sw.on{background:var(--ok)}.sw.on::after{left:13px;background:#fff}
.step{display:flex;align-items:center;gap:2px}
.step span{min-width:30px;text-align:center;color:var(--ink)}
.foot{display:flex;justify-content:space-between;align-items:center;margin:12px 0 2px;font-size:10px;color:var(--ink3)}
.foot a{color:var(--ink3)}
.foot button.pri{color:var(--ink);background:var(--hover);padding:3px 12px;font-size:12px}
.opt button.pri{color:var(--ink);background:var(--hover);padding:2px 10px;flex:none}
</style>
</head>

<div id="app">

      <div class="sec" id="sX">
        <div class="top"><span class="nm">Codex<em id="xA"></em></span><span class="big" id="xV">—</span></div>
        <div class="tr"><i id="xB"></i><s id="xP" class="hide"></s></div>
        <div class="mt"><span id="xM1"></span><span id="xM2"></span></div>
        <div class="oas hide" id="xO"></div>
        <div class="oas swb hide" id="xW"></div>
      </div>
      <div class="sec" id="sL">

        <svg class="sp" viewBox="0 0 264 26" preserveAspectRatio="none"><polygon id="lA" fill="var(--ok)" fill-opacity=".12" points=""/><polyline id="lS" fill="none" stroke="var(--ok)" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" points=""/></svg>
        <div class="mt"><span id="lM1"></span><span id="lM2"></span></div>
        <div class="ctl hide" id="lC"><span id="lCs"></span><button id="lCb"></button></div>
      </div>
      <div class="empty hide" id="empty"><span data-t="empty"></span> <a id="emptyGo" data-t="open_settings"></a></div>
      <div class="alert hide" id="al"></div>
    </div>
    <div class="set hide" id="vSet">
      <h4 data-t="show_what"></h4>
      <div id="srcRows"></div>
      <h4 data-t="options"></h4>
      <div class="opt"><span data-t="opt_style"></span><span class="seg" id="seg"><button data-s="smoke" data-t="st_smoke"></button><button data-s="frost" data-t="st_frost"></button><button data-s="clear" data-t="st_clear"></button></span></div>
      <div class="opt"><span data-t="opt_refresh"></span><span class="sw" id="oRefresh"></span></div>
      <div class="opt"><span data-t="opt_codex_live"></span><span class="sw" id="oCodex"></span></div>
      <div class="opt"><span data-t="opt_codex_switch"></span><span class="sw" id="oSwitch"></span></div>
      <div class="opt hide" id="swAddRow"><span data-t="sw_add_hint"></span><button class="pri" id="bSwAdd" data-t="sw_add"></button></div>
      <div class="opt"><span data-t="opt_autostart"></span><span class="sw" id="oAuto"></span></div>
      <div class="opt"><span data-t="opt_fullscreen"></span><span class="sw" id="oFull"></span></div>
      <div class="opt"><span data-t="opt_margin"></span><span class="step"><button id="mMinus">−</button><span id="mVal"></span><button id="mPlus">+</button></span></div>
      <div class="opt"><span data-t="opt_lang"></span><span class="seg" id="langSeg"><button data-l="auto" data-t="lang_auto"></button><button data-l="zh">中文</button><button data-l="en">English</button></span></div>
      <div class="foot"><a id="dataDir"></a><button class="pri" id="bDone" data-t="done"></button></div>
    </div>
    <div class="tools" id="tools">
      <div class="seg"><button id="bSet"></button></div>
      <div class="seg"><button id="bPin"></button><button id="bRef" data-t="refresh"></button><button id="bQuit" data-t="quit"></button></div>
    </div>
  </div>
</div>

$('bSwAdd').onclick=async()=>{closeSet();pinned=false;updPin();await pullSw();swAdd()};  // 回到主界面，确认和提示都在切换列表下面
$('oFull').onclick=()=>saveSet({hide_on_fullscreen:!$('oFull').classList.contains('on')});
$('oAuto').onclick=async()=>{const want=!$('oAuto').classList.contains('on');$('oAuto').classList.toggle('on',want);const r=await api('set_autostart',want);if(SETDATA){SETDATA.autostart=!!r;renderSet()}};
$('mMinus').onclick=()=>saveSet({snap_margin:Math.max(0,((SETDATA&&SETDATA.settings.snap_margin)??8)-2)});
$('mPlus').onclick=()=>saveSet({snap_margin:Math.min(40,((SETDATA&&SETDATA.settings.snap_margin)??8)+2)});
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>{saveSet({lang:b.dataset.l});setLang(b.dataset.l)});
$('dataDir').onclick=()=>api('open_data_dir');
function fit(){const r=$('app').getBoundingClientRect();const k=Math.ceil(r.width)+'x'+Math.ceil(r.height);if(k!==lastH&&window.pywebview&&pywebview.api){lastH=k;pywebview.api.fit(Math.ceil(r.width),Math.ceil(r.height))}}
async function setOpen(v){if(open===v)return;open=v;if(v){pullSw();const i=await api('init');if(i)document.body.classList.toggle('up',!!i.up)}
  else if(view==='set')showView('main');document.body.classList.toggle('open',v);requestAnimationFrame(fit)}
function updPin(){$('bPin').textContent=t(pinned?'unpin':'pin');$('bPin').classList.toggle('on',pinned)}
function scheduleOpen(){clearTimeout(openTimer);if(mode==='popup'&&!dragging&&!open)openTimer=setTimeout(()=>{if(hover&&!dragging)setOpen(true)},280)}
document.body.addEventListener('mouseenter',()=>{hover=true;clearTimeout(timer);scheduleOpen()});
document.body.addEventListener('mouseleave',()=>{hover=false;clearTimeout(openTimer);if(pinned||!open)return;clearTimeout(timer);timer=setTimeout(()=>setOpen(false),2500)});
$('pill').addEventListener('mousedown',e=>{if(e.button!==0)return;dragging=true;downAt=[e.screenX,e.screenY];clearTimeout(openTimer)});
window.addEventListener('mouseup',e=>{if(!dragging)return;dragging=false;
  if(downAt&&Math.hypot(e.screenX-downAt[0],e.screenY-downAt[1])>3)api('snap').then(()=>{lastH='';fit()});
  downAt=null;if(hover)scheduleOpen()});
function setMode(m,save){mode=m;$('tg').classList.toggle('on',m==='popup');$('tgw').title=t(m==='popup'?'tip_popup':'tip_pill');if(save)api('set_mode',m)}
$('tgw').addEventListener('mousedown',e=>e.stopPropagation());
$('tgw').addEventListener('click',e=>{e.stopPropagation();
  if(mode==='popup'){setMode('pill',true);pinned=false;updPin();clearTimeout(openTimer);setOpen(false)}else{setMode('popup',true);setOpen(true)}});
$('bPin').onclick=()=>{pinned=!pinned;updPin()};
$('bRef').onclick=()=>{api('refresh');setTimeout(pull,800)};
$('bQuit').onclick=()=>api('quit');
function setStyle(s,save){document.body.classList.remove('s-clear','s-frost','s-smoke');document.body.classList.add('s-'+s);
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));if(save)api('set_style',s);lastH='';requestAnimationFrame(fit)}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setStyle(b.dataset.s,true));
async function pull(){
  try{if(window.pywebview&&pywebview.api&&pywebview.api.state)render(await pywebview.api.state());
    else if(window.MOCK)render(window.MOCK);
    else{const r=await fetch('http://127.0.0.1:8765/status.json');render(await r.json())}}catch(e){}
}
// 给 Python 端检查 WebView2 是不是掉到了软件渲染（软件渲染时透明可能失效）
window.__gpu=()=>{try{const g=document.createElement('canvas').getContext('webgl');if(!g)return'none';
  const e=g.getExtension('WEBGL_debug_renderer_info'),r=String(g.getParameter(e?e.UNMASKED_RENDERER_WEBGL:g.RENDERER));
  const l=g.getExtension('WEBGL_lose_context');if(l)l.loseContext();return r}catch(e){return'err '+e}};
const q=new URLSearchParams(location.search);
setLang(q.get('lang')||'auto');setStyle(q.get('style')||'smoke',false);
if(q.get('open'))setOpen(true);
setInterval(pull,1000);
setInterval(()=>{if(open&&!swBusy)pullSw()},3000);
// 开机时 Python 那边可能还很忙，init 偶尔拿不到；拿不到就重试，否则会一直停在默认样式
window.addEventListener('pywebviewready',async()=>{let i=null;
  for(let n=0;n<30&&!i;n++){i=await api('init');if(!i)await new Promise(r=>setTimeout(r,1000))}
  if(i){setStyle(i.style||'smoke',false);setMode(i.mode||'popup',false);setLang(i.lang||'auto');document.body.classList.toggle('up',!!i.up);
    if(i.first_run)openSettings()}
  pull();setTimeout(()=>api('snap'),1500)});
pull();
</script>
</body>
</html>
